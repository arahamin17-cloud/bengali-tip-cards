name: Daily tip cards

# Runs the whole unattended pipeline every day:
#   scrape -> clean -> render cards -> schedule to the Facebook page.
# Scheduled a couple of hours before the first daily slot so GitHub's cron
# delays never push a post inside Facebook's 10-minute minimum.
on:
  schedule:
    - cron: '0 2 * * *' # 02:00 UTC = 08:00 Dhaka
  workflow_dispatch:
    inputs:
      theme:
        description: Card theme (navy/rose/emerald/plum/random)
        default: random
      limit:
        description: Cap cards rendered this run (0 = all)
        default: "0"

jobs:
  pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Unit tests
        run: python -m unittest discover -s scripts/tests -v

      - name: Run the daily pipeline
        env:
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          SCRAPE_CMD: ${{ vars.SCRAPE_CMD || 'python3 scripts/scrape_tips.py --out data/tips_raw.txt --max 4' }}
          RAW_TIPS: data/tips_raw.txt
          TIPS_CSV: data/tips.csv
          CARDS_DIR: cards-daily
          THEME: ${{ github.event.inputs.theme || 'random' }}
          LIMIT: ${{ github.event.inputs.limit || '0' }}
          SLOT_TIMES: "04:00,14:00" # 10:00 & 20:00 Dhaka
        run: bash scripts/pipeline.sh

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cards
          path: cards-daily/
          if-no-files-found: ignore
