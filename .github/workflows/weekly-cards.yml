name: Weekly tip cards

# Runs the whole unattended pipeline once a week:
#   scrape -> clean -> render cards -> schedule to the Facebook page.
# A weekly batch (~21 tips) is collected, rendered and then scheduled across
# the coming week. Runs a couple of hours before the first daily slot so
# GitHub's cron delays never push a post inside Facebook's 10-minute minimum.
on:
  schedule:
    - cron: '0 2 * * 1' # Mondays, 02:00 UTC = 08:00 Dhaka
  workflow_dispatch:
    inputs:
      theme:
        description: Card theme (navy/rose/emerald/plum/random)
        default: random
      limit:
        description: Cap cards rendered this run (0 = all)
        default: "0"

jobs:
  pipeline:
    runs-on: ubuntu-latest
    # Needed to commit data/ back (see the last step). Without it the manifest
    # starts empty every run and each week's cards are queued all over again.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Unit tests
        run: python -m unittest discover -s scripts/tests -v

      - name: Run the weekly pipeline
        env:
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          SCRAPE_CMD: ${{ vars.SCRAPE_CMD || 'python3 scripts/scrape_tips.py --out data/tips_raw.txt --target-tips 21' }}
          RAW_TIPS: data/tips_raw.txt
          TIPS_CSV: data/tips.csv
          CARDS_DIR: cards-daily
          THEME: ${{ github.event.inputs.theme || 'random' }}
          LIMIT: ${{ github.event.inputs.limit || '0' }}
          SLOT_TIMES: "04:00,09:00,14:00" # 10:00, 15:00 & 20:00 Dhaka
        run: bash scripts/pipeline.sh

      # The queue state has to outlive the run. cards-daily/ is regenerated from
      # scratch every run, so the manifest is kept in data/ and committed back
      # here - otherwise the next week starts from an empty manifest and re-queues
      # every card it rendered. data/.scrape-seen.txt is committed for the same
      # reason: it stops the scraper re-adding articles it already saw.
      - name: Persist the queue state
        if: always()
        run: |
          git add data/ 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "nothing to persist"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: update the card queue state"
          git push

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cards
          path: cards-daily/
          if-no-files-found: ignore
